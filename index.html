<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Júlia Marcico Nails · Painel</title>
<meta name="theme-color" content="#c4507a">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--bg:#faf6f3;--card:#fff;--ink:#2a1f24;--muted:#8b7b81;--line:#efe4e7;--rose:#c4507a;--rose-ink:#fff;--rose-soft:#f8e6ed;--green:#2e8b66;--green-soft:#e3f3ec;--red:#c2483f;--red-soft:#fae7e5;--amber:#a86d14;--amber-soft:#fbf0dc;--shadow:0 1px 2px rgba(60,20,35,.04),0 6px 18px rgba(60,20,35,.06);--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17121a;--card:#221b25;--ink:#f3e9ee;--muted:#a8979f;--line:#352b38;--rose:#e27aa0;--rose-ink:#1b1015;--rose-soft:#3a2330;--green:#5cc497;--green-soft:#1d3229;--red:#ee7a70;--red-soft:#3b2220;--amber:#e3ac57;--amber-soft:#3a2f1c;--shadow:none}}
:root[data-theme=dark]{--bg:#17121a;--card:#221b25;--ink:#f3e9ee;--muted:#a8979f;--line:#352b38;--rose:#e27aa0;--rose-ink:#1b1015;--rose-soft:#3a2330;--green:#5cc497;--green-soft:#1d3229;--red:#ee7a70;--red-soft:#3b2220;--amber:#e3ac57;--amber-soft:#3a2f1c;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16.5px}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:4px 16px 120px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.k{font-size:11.5px;color:var(--rose);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.view{display:none}.view.on{display:block}
.view>*+*{margin-top:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.mt{margin-top:12px}
.cap::first-letter{text-transform:uppercase}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Manrope,sans-serif;padding:10px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;min-height:42px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.p{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.btn.g{background:var(--green-soft);border-color:transparent;color:var(--green)}
.btn.r{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn.s{padding:6px 11px;min-height:34px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--rose-soft);color:var(--rose);white-space:nowrap}
.chip button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0 0 0 2px}
.chip.pendente{background:var(--amber-soft);color:var(--amber)}
.chip.confirmado{background:var(--green-soft);color:var(--green)}
.chip.concluido{background:var(--line);color:var(--muted)}
.chip.cancelado,.chip.recusado{background:var(--red-soft);color:var(--red)}
input,select,textarea{width:100%;font:15px Manrope,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--rose)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--rose)}
.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field+.field{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg.two{grid-template-columns:1fr 1fr}
.seg.days7{grid-template-columns:repeat(7,1fr)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 0;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;background:var(--bg)}
.seg input:checked+span{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;color:var(--muted);font:700 10.5px Manrope,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;position:relative;cursor:pointer}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--rose)}
.badge{position:absolute;top:0;left:calc(50% + 5px);background:var(--rose);color:var(--rose-ink);font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,15,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{background:var(--amber-soft);color:var(--amber);font-size:12.5px;padding:8px 12px;border-radius:12px;margin-top:8px;font-weight:600;flex:1}
/* agenda */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:6px 0 4px;text-align:center;cursor:pointer;font:600 11px Manrope,sans-serif;color:var(--muted)}
.day b{display:block;font-size:18px;color:var(--ink);font-family:Fraunces,serif}
.day i{display:block;font-style:normal;color:var(--rose);height:12px;line-height:12px;letter-spacing:1px}
.day.today{border-color:var(--rose)}
.day.on{background:var(--rose);border-color:var(--rose);color:var(--rose-ink)}
.day.on b,.day.on i{color:var(--rose-ink)}
.ag{display:grid;grid-template-columns:58px 1fr;gap:12px}
.ag .hr{font-weight:700;font-size:16px;border-right:2px solid var(--rose-soft);padding-right:8px}
.ag .hr small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.ag.cancelado,.ag.concluido{opacity:.62}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.obs{font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
.pend{border-color:color-mix(in srgb,var(--amber) 35%,var(--line));background:linear-gradient(var(--amber-soft),var(--card) 60px)}
.pitem{padding-top:12px;border-top:1px dashed var(--line)}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--rose);color:var(--rose-ink);font-size:30px;box-shadow:0 8px 22px rgba(196,80,122,.35);cursor:pointer;z-index:9}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font:600 13px Manrope,sans-serif;color:var(--ink);cursor:pointer}
.slot.on{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}
.slot.ro{cursor:default}
.note{background:var(--rose-soft);color:var(--rose);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600}
/* finance */
.mnav{display:flex;align-items:center;justify-content:space-between}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .v{font-family:Fraunces,serif;font-size:22px;font-weight:600;margin-top:2px}
.kpi.big{grid-column:1/-1;background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}
.kpi.big .k{color:inherit;opacity:.85}
.kpi.big .v{font-size:30px}
.pos{color:var(--green)}.neg{color:var(--red)}
.bl{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bl+.bl{margin-top:8px}
.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose);border-radius:5px}
.bar.red i{background:var(--red)}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:120px}
.col{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.col i{width:11px;border-radius:4px 4px 0 0;background:var(--rose);min-height:2px}
.col i.s{background:var(--red);opacity:.65}
.collab{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center;font-size:11.5px;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;background:var(--rose)}
.legend i.s{background:var(--red);opacity:.65}
.mov{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.mov+.mov{border-top:1px solid var(--line)}
/* chat */
.conv{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 2px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.conv+.conv{border-top:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center;font-weight:700;flex:none}
.cx{flex:1;min-width:0;display:flex;flex-direction:column}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.unread{width:10px;height:10px;border-radius:50%;background:var(--rose);display:block}
.msgs{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px}
.msg{max-width:82%;padding:8px 12px;border-radius:16px 16px 16px 4px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--rose);color:var(--rose-ink);border-color:var(--rose);border-radius:16px 16px 4px 16px}
.msg time{display:block;font-size:10.5px;opacity:.7;text-align:right;margin-top:2px}
.chatbar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.chathead{position:sticky;top:76px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px}
/* ajustes */
.linkbox{font:600 13px ui-monospace,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;word-break:break-all}
.serv{padding:10px 0;border-top:1px solid var(--line)}
.grid3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
.hrow{padding:10px 0;border-top:1px solid var(--line)}
.tg{display:flex;align-items:center;gap:10px;font-weight:700}
.hfields{display:flex;align-items:center;gap:6px;margin-top:8px}
.hfields input{min-height:40px;padding:8px}
.hfields span{font-size:13px;color:var(--muted);flex:none}
.hrow.off .hfields{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* login */
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:380px;padding:24px}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px}
.logo{width:56px;height:56px;border-radius:16px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div>
      <div class="k" id="nomeNegocio">Júlia Marcico Nails</div>
      <h1 id="tituloView">Agenda</h1>
    </div>
    <button class="btn s" data-act="copiarLink" title="Copiar link de agendamento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      Link
    </button>
  </div>
  <div class="top-in"><div id="demo" class="demo" hidden>Modo demonstração — dados de exemplo, salvos só neste aparelho. Configure o Firebase no config.js para usar de verdade.</div></div>
</header>

<main class="wrap">
  <section class="view on" id="v-agenda"></section>
  <section class="view" id="v-encaixes"></section>
  <section class="view" id="v-fin"></section>
  <section class="view" id="v-chat"></section>
  <section class="view" id="v-ajustes"></section>
</main>

<nav class="tabbar"><div class="tabbar-in">
  <button class="tab on" data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda<span class="badge" data-b="agenda" hidden></span></button>
  <button class="tab" data-v="encaixes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Encaixes<span class="badge" data-b="encaixes" hidden></span></button>
  <button class="tab" data-v="fin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>Financeiro</button>
  <button class="tab" data-v="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chat<span class="badge" data-b="chat" hidden></span></button>
  <button class="tab" data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
</div></nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<div class="login" id="login" hidden>
  <div class="card stack">
    <img class="logo" src="icon.svg" alt="">
    <h1>Júlia Marcico Nails</h1>
    <p class="muted">Entre para ver sua agenda.</p>
    <form id="loginForm" class="stack">
      <input type="email" name="email" placeholder="E-mail" autocomplete="username" required>
      <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required>
      <button class="btn p block">Entrar</button>
      <button type="button" class="btn ghost block" id="esqueci">Esqueci minha senha</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>
</div>

<script type="module">
/* ================= NÚCLEO DE DADOS (Firebase ou demonstração) ================= */
const CFG = window.APP_CONFIG || {};
const DEMO = !(CFG.firebase && CFG.firebase.apiKey && !/COLE/i.test(CFG.firebase.apiKey));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const bus = new EventTarget();
const mem = {};
function lsGet(k){ try{ const v = localStorage.getItem(k); if (v) return JSON.parse(v); }catch(e){} return mem[k] ?? null; }
function lsSet(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const demoCol = p => lsGet('demo:' + p) || {};
function demoSave(p, c){ lsSet('demo:' + p, c); bus.dispatchEvent(new Event('ch')); }
addEventListener('storage', e => { if (e.key && e.key.startsWith('demo:')) bus.dispatchEvent(new Event('ch')); });
function onBus(run){ run(); bus.addEventListener('ch', run); return () => bus.removeEventListener('ch', run); }
let fb = null;
async function initStore(){
  if (DEMO) return;
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [a, f, au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
  const app = a.initializeApp(CFG.firebase);
  fb = { f, au, db: f.initializeFirestore(app, { ignoreUndefinedProperties: true }), auth: au.getAuth(app) };
}
const store = {
  async set(path, id, data){
    if (DEMO){ const c = demoCol(path); c[id] = { ...(c[id] || {}), ...data }; demoSave(path, c); return id; }
    await fb.f.setDoc(fb.f.doc(fb.db, path, id), data, { merge: true }); return id;
  },
  add(path, data){ return store.set(path, uid(), data); },
  async remove(path, id){
    if (DEMO){ const c = demoCol(path); delete c[id]; demoSave(path, c); return; }
    await fb.f.deleteDoc(fb.f.doc(fb.db, path, id));
  },
  watch(path, cb){
    if (DEMO) return onBus(() => cb(Object.entries(demoCol(path)).map(([id, d]) => ({ id, ...d }))));
    return fb.f.onSnapshot(fb.f.collection(fb.db, path), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => console.error(path, e));
  },
  watchDoc(path, id, cb){
    if (DEMO) return onBus(() => { const d = demoCol(path)[id]; cb(d ? { id, ...d } : null); });
    return fb.f.onSnapshot(fb.f.doc(fb.db, path, id), d => cb(d.exists() ? { id: d.id, ...d.data() } : null), e => console.error(path, e));
  }
};

/* ================= UTILITÁRIOS ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const toMin = h => { const [a, b] = String(h || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
const toHM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = s => { s = String(s ?? '').trim().replace(/[^\d.,-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return Number(s) || 0; };
const digits = s => String(s || '').replace(/\D/g, '');
const waLink = (tel, msg) => { let d = digits(tel); if (d && d.length <= 11) d = '55' + d; return `https://wa.me/${d}?text=${encodeURIComponent(msg || '')}`; };
const pn = n => String(n || '').trim().split(/\s+/)[0];
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_LONGO = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const fmtCurto = s => { const d = parseYmd(s); return `${DIAS[d.getDay()].toLowerCase()} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };

/** Horários livres de um dia para um serviço de `dur` minutos */
function slotsDoDia(cfg, ocupados, dataStr, dur, antecH){
  if (!cfg || !dataStr) return [];
  const d = parseYmd(dataStr); const h = cfg.horarios?.[d.getDay()];
  if (!h || !h.ativo || (cfg.bloqueios || []).includes(dataStr)) return [];
  const ini = toMin(h.ini), fim = toMin(h.fim), step = Number(cfg.intervalo) || 30;
  const pI = h.pIni && h.pFim ? toMin(h.pIni) : null, pF = h.pIni && h.pFim ? toMin(h.pFim) : null;
  const occ = ocupados.filter(o => o.data === dataStr).map(o => [toMin(o.ini), toMin(o.fim)]);
  const limite = Date.now() + (Number(antecH) || 0) * 3600e3;
  const out = [];
  for (let t = ini; t + dur <= fim; t += step){
    const e = t + dur;
    if (pI != null && t < pF && e > pI) continue;
    if (occ.some(([a, b]) => t < b && e > a)) continue;
    const dt = new Date(d); dt.setHours(0, t, 0, 0);
    if (dt.getTime() < limite) continue;
    out.push(toHM(t));
  }
  return out;
}

    };

    f.onsubmit = async e => {
      e.preventDefault();
      const s = sv.find(x => x.id === f.servico.value) || { id: '', nome: 'Serviço', duracao: 60, preco: 0 };
      const ini = f.hora.value; const fim = toHM(toMin(ini) + (Number(s.duracao) || 60));
      const data = { nome: f.nome.value.trim(), telefone: f.telefone.value.trim(), servicoId: s.id, servicoNome: s.nome, duracao: Number(s.duracao) || 60, preco: Number(s.preco) || 0, data: f.data.value, ini, fim, obs: f.obs.value.trim(), status: 'confirmado', origem: pre.encaixeId ? 'encaixe' : 'manual', criadoEm: Date.now() };
      const conflito = agsAtivos().find(a => a.data === data.data && toMin(ini) < toMin(a.fim) && toMin(fim) > toMin(a.ini));
      if (conflito && !confirm(`Esse horário bate com ${conflito.nome} (${conflito.ini}–${conflito.fim}). Salvar mesmo assim?`)) return;
      const id = uid();
      await store.set('agendamentos', id, data);

      if (pre.encaixeId) await store.set('encaixes', pre.encaixeId, { status: 'encaixada', agendamentoId: id });
      S.sel = data.data;
      if (data.telefone) avisoSheet('Horário salvo ✓', `${data.nome} · ${dataLonga(data.data)} às ${ini}`, waLink(data.telefone, msgConfirmacao(data)), 'Enviar confirmação no WhatsApp');
      else { closeSheet(); toast('Horário salvo'); }
      render();
    };
  });
}

const CATS = ['Material', 'Aluguel', 'Transporte', 'Alimentação', 'Divulgação', 'Outros'];
function barList(pares, red){
  const mx = Math.max(1, ...pares.map(p => p[1]));
  return pares.length ? pares.map(([l, v]) => `<div class="bl"><span class="one">${esc(l)}</span><div class="bar ${red ? 'red' : ''}"><i style="width:${(v / mx * 100).toFixed(1)}%"></i></div><b>${brl(v)}</b></div>`).join('') : '<p class="muted small">Nada registrado neste mês.</p>';
}
function renderFin(){
  const el = $('#v-fin'); const m = S.mes;
  const vs = S.vendas.filter(v => (v.data || '').startsWith(m));
  const ds = S.desp.filter(v => (v.data || '').startsWith(m));
  const ent = sum(vs), sai = sum(ds), luc = ent - sai;
  const serv = vs.filter(v => v.tipo !== 'produto');
  const ticket = serv.length ? sum(serv) / serv.length : 0;
  const porForma = Object.entries(FORMAS).map(([k, l]) => [l, sum(vs.filter(v => v.forma === k))]).filter(p => p[1] > 0);
  const agrupa = (arr, key) => { const o = {}; arr.forEach(v => { const k = v[key] || 'Outros'; o[k] = (o[k] || 0) + (Number(v.valor) || 0); }); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const [y, mm] = m.split('-').map(Number);
  const meses = [];
  for (let i = 5; i >= 0; i--){
    const d = new Date(y, mm - 1 - i, 1); const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    meses.push({ k, lab: d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''), e: sum(S.vendas.filter(v => (v.data || '').startsWith(k))), s: sum(S.desp.filter(v => (v.data || '').startsWith(k))) });
  }
  const mx = Math.max(1, ...meses.flatMap(x => [x.e, x.s]));
  const movs = [...vs.map(v => ({ ...v, _t: 'v' })), ...ds.map(d => ({ ...d, _t: 'd' }))].sort((a, b) => (b.data || '').localeCompare(a.data || '') || (b.criadoEm || 0) - (a.criadoEm || 0));
  const titulo = parseYmd(m + '-01').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  el.innerHTML = `
    <div class="mnav"><button class="btn s ghost" data-act="mes" data-n="-1" aria-label="Mês anterior">‹</button><h2 class="cap">${titulo}</h2><button class="btn s ghost" data-act="mes" data-n="1" aria-label="Próximo mês">›</button></div>
    <div class="kpis">
      <div class="card kpi big"><div class="k">Lucro do mês</div><div class="v">${brl(luc)}</div></div>
      <div class="card kpi"><div class="k">Entradas</div><div class="v pos">${brl(ent)}</div></div>
      <div class="card kpi"><div class="k">Saídas</div><div class="v neg">${brl(sai)}</div></div>
      <div class="card kpi"><div class="k">Atendimentos</div><div class="v">${serv.length}</div></div>
      <div class="card kpi"><div class="k">Ticket médio</div><div class="v">${brl(ticket)}</div></div>
    </div>
    <div class="row"><button class="btn g grow" data-act="novaVenda">+ Entrada</button><button class="btn r grow" data-act="novaDesp">+ Saída</button></div>
    <div class="card"><div class="row between"><h3>Últimos 6 meses</h3><div class="legend"><span><i></i>Entradas</span><span><i class="s"></i>Saídas</span></div></div>
      <div class="cols mt">${meses.map(x => `<div class="col" title="${x.lab}: ${brl(x.e)} / ${brl(x.s)}"><i style="height:${(x.e / mx * 100).toFixed(1)}%"></i><i class="s" style="height:${(x.s / mx * 100).toFixed(1)}%"></i></div>`).join('')}</div>
      <div class="collab">${meses.map(x => `<span style="${x.k === m ? 'color:var(--rose);font-weight:700' : ''}">${x.lab}</span>`).join('')}</div></div>
    <div class="card"><h3>Como você recebeu</h3><div class="mt">${barList(porForma)}</div></div>
    <div class="card"><h3>O que mais vendeu</h3><div class="mt">${barList(agrupa(vs, 'descricao').slice(0, 6))}</div></div>
    ${ds.length ? `<div class="card"><h3>Para onde foi o dinheiro</h3><div class="mt">${barList(agrupa(ds, 'categoria'), true)}</div></div>` : ''}
    <div class="card"><h3>Movimentações</h3>
      ${movs.length ? movs.map(x => `<div class="mov"><div style="min-width:0"><b class="one" style="display:block">${esc(x.descricao)}</b><span class="muted small">${fmtCurto(x.data)} · ${x._t === 'v' ? (FORMAS[x.forma] || '') + (x.cliente ? ' · ' + esc(x.cliente) : '') + (x.tipo === 'produto' ? ' · produto' : '') : esc(x.categoria || '')}</span></div>
        <div class="row" style="flex-wrap:nowrap"><b class="${x._t === 'v' ? 'pos' : 'neg'}">${x._t === 'v' ? '+' : '−'}${brl(x.valor)}</b><button class="btn s ghost" data-act="delMov" data-t="${x._t}" data-id="${x.id}" aria-label="Apagar">×</button></div></div>`).join('') : '<p class="muted small mt">Sem movimentações neste mês.</p>'}</div>`;
}
function formVenda(){
  const sv = C().servicos || [];
  sheet(`<h2>Nova entrada</h2><form class="mt" autocomplete="off">
    <div class="field"><label class="f">O que foi vendido</label><input name="descricao" list="lsv" required placeholder="Ex.: Pé e mão, esmalte, kit…"><datalist id="lsv">${sv.map(s => `<option value="${esc(s.nome)}">`).join('')}</datalist></div>
    <div class="field"><label class="f">Tipo</label><div class="seg two"><label><input type="radio" name="tipo" value="servico" checked><span>Serviço</span></label><label><input type="radio" name="tipo" value="produto"><span>Produto</span></label></div></div>
    <div class="grid2 field"><div><label class="f">Valor (R$)</label><input name="valor" inputmode="decimal" required placeholder="0,00"></div><div><label class="f">Data</label><input type="date" name="data" required value="${ymd(new Date())}"></div></div>
    <div class="field"><label class="f">Cliente (opcional)</label><input name="cliente"></div>
    <div class="field"><label class="f">Pagamento</label>${segFormas()}</div>
    <div class="row mt"><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn p grow">Salvar entrada</button></div></form>`, sh => {
    const f = sh.querySelector('form');
    f.descricao.oninput = () => { const s = sv.find(x => x.nome === f.descricao.value); if (s && !f.valor.value) f.valor.value = String(s.preco).replace('.', ','); };
    f.onsubmit = async e => {
      e.preventDefault();
      await store.add('vendas', { descricao: f.descricao.value.trim(), tipo: f.tipo.value, valor: num(f.valor.value), data: f.data.value, cliente: f.cliente.value.trim(), forma: f.forma.value, criadoEm: Date.now() });
      S.mes = f.data.value.slice(0, 7); closeSheet(); toast('Entrada salva'); render();
    };
  });
}
function formDesp(){
  sheet(`<h2>Nova saída</h2><form class="mt" autocomplete="off">
    <div class="field"><label class="f">Descrição</label><input name="descricao" required placeholder="Ex.: esmaltes, aluguel da sala…"></div>
    <div class="field"><label class="f">Categoria</label><select name="categoria">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
    <div class="grid2 field"><div><label class="f">Valor (R$)</label><input name="valor" inputmode="decimal" required placeholder="0,00"></div><div><label class="f">Data</label><input type="date" name="data" required value="${ymd(new Date())}"></div></div>
    <div class="row mt"><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn p grow">Salvar saída</button></div></form>`, sh => {
    const f = sh.querySelector('form');
    f.onsubmit = async e => {
      e.preventDefault();
      await store.add('despesas', { descricao: f.descricao.value.trim(), categoria: f.categoria.value, valor: num(f.valor.value), data: f.data.value, criadoEm: Date.now() });
      S.mes = f.data.value.slice(0, 7); closeSheet(); toast('Saída salva'); render();
    };
  });
}

/* ---------- Chat ---------- */
const hora = t => { if (!t) return ''; const d = new Date(t); return ymd(d) === ymd(new Date()) ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const iniciais = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
function renderChatList(){
  const el = $('#v-chat'); const cs = [...S.convs].filter(c => c.ultimaMsg).sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0));
  el.innerHTML = cs.length ? `<div class="card" style="padding:4px 12px">${cs.map(c => `<button class="conv" data-act="abrirChat" data-id="${c.id}"><span class="av">${esc(iniciais(c.nome))}</span>
      <span class="cx"><b class="one">${esc(c.nome || 'Cliente')}</b><span class="muted small one">${c.ultimaDe === 'admin' ? 'Você: ' : ''}${esc(c.ultimaMsg)}</span></span>
      <span class="cz"><small class="muted">${hora(c.atualizadoEm)}</small>${c.naoLidaAdmin ? '<i class="unread"></i>' : ''}</span></button>`).join('')}</div>`
    : `<div class="card empty">Nenhuma conversa ainda.<br>Quando uma cliente escrever pelo link de agendamento, a mensagem aparece aqui.</div>`;
}
function renderMsgs(){
  const box = $('#msgs'); if (!box) return;
  box.innerHTML = S.msgs.length ? S.msgs.map(m => `<div class="msg ${m.de === 'admin' ? 'me' : ''}">${esc(m.texto)}<time>${hora(m.em)}</time></div>`).join('') : '<p class="muted small center">Sem mensagens.</p>';
  scrollTo(0, document.body.scrollHeight);
}
function abrirChat(id){
  S.chat = id; S.msgs = []; const c = S.convs.find(x => x.id === id) || {};
  $('#v-chat').innerHTML = `<div class="card chathead"><button class="btn s ghost" data-act="voltarChat">‹ Voltar</button><b class="one">${esc(c.nome || 'Cliente')}</b>
      ${c.telefone ? `<a class="btn s g" target="_blank" rel="noopener" href="${waLink(c.telefone, 'Oi ' + pn(c.nome) + '!')}">WhatsApp</a>` : '<span></span>'}</div>
    <div id="msgs" class="msgs"></div>
    <form id="chatForm" class="chatbar" autocomplete="off"><input name="t" placeholder="Escreva uma mensagem"><button class="btn p">Enviar</button></form>`;
  unsubMsgs && unsubMsgs();
  unsubMsgs = store.watch(`conversas/${id}/msgs`, ms => {
    S.msgs = ms.sort((a, b) => (a.em || 0) - (b.em || 0)); renderMsgs();
    if (S.convs.find(x => x.id === id)?.naoLidaAdmin) store.set('conversas', id, { naoLidaAdmin: false });
  });
  $('#chatForm').onsubmit = async e => {
    e.preventDefault(); const inp = e.target.t; const t = inp.value.trim(); if (!t) return; inp.value = '';
    await store.add(`conversas/${id}/msgs`, { de: 'admin', texto: t, em: Date.now() });
    await store.set('conversas', id, { ultimaMsg: t, ultimaDe: 'admin', atualizadoEm: Date.now(), naoLidaCliente: true });
  };
}
function fecharChat(){ S.chat = null; unsubMsgs && unsubMsgs(); unsubMsgs = null; }

      <div class="grid3"><div><span class="f">Duração (min)</span><input data-k="duracao" type="number" inputmode="numeric" min="5" step="5" value="${s.duracao}"></div><div><span class="f">Preço (R$)</span><input data-k="preco" inputmode="decimal" value="${String(s.preco).replace('.', ',')}"></div><button type="button" class="btn s r" data-act="delServ" data-i="${i}">Remover</button></div></div>`).join('')}</div>
  <div class="card"><h3>Horário de atendimento</h3>
    ${[1, 2, 3, 4, 5, 6, 0].map(d => { const h = (c.horarios || {})[d] || {}; return `<div class="hrow ${h.ativo ? '' : 'off'} mt" data-d="${d}">
      <label class="tg"><input type="checkbox" data-k="ativo" ${h.ativo ? 'checked' : ''}>${DIAS_LONGO[d]}${h.ativo ? '' : ' <span class="muted small">· fechado</span>'}</label>
      <div class="hfields"><input type="time" data-k="ini" value="${h.ini || '09:00'}"><span>às</span><input type="time" data-k="fim" value="${h.fim || '18:00'}"></div>
      <div class="hfields"><span>Pausa</span><input type="time" data-k="pIni" value="${h.pIni || ''}"><span>às</span><input type="time" data-k="pFim" value="${h.pFim || ''}"></div></div>`; }).join('')}</div>
  <div class="card stack"><h3>Regras do link</h3>
    <div><label class="f">Horários de quantos em quantos minutos</label><select id="aj-int">${[15, 20, 30, 45, 60].map(n => `<option value="${n}" ${Number(c.intervalo) === n ? 'selected' : ''}>${n} min</option>`).join('')}</select></div>
    <div class="grid2"><div><label class="f">Antecedência mínima (h)</label><input id="aj-ant" type="number" min="0" value="${c.antecedenciaHoras}"></div><div><label class="f">Agenda aberta (dias)</label><input id="aj-dias" type="number" min="1" max="120" value="${c.diasAFrente}"></div></div></div>
  <div class="card stack"><h3>Folgas e dias bloqueados</h3>

  <button class="btn p block" data-act="salvarAjustes">Salvar ajustes</button>
  <div class="card stack"><h3>Avisos no celular</h3><p class="muted small">Receber aviso quando chegar pedido de horário ou mensagem (com o app aberto em segundo plano).</p><button class="btn s" data-act="notif">Ativar avisos</button></div>

  $('#v-ajustes').querySelectorAll('.hrow [data-k=ativo]').forEach(cb => cb.onchange = () => { lerAjustes(); renderAjustes(); });

function lerAjustes(){
  const c = S.draft; const v = $('#v-ajustes');
  c.nome = $('#aj-nome').value.trim() || 'Meu espaço';
  c.whatsapp = $('#aj-whats').value.trim();
  c.boasVindas = $('#aj-boas').value.trim();
  c.servicos = [...v.querySelectorAll('.serv')].map((r, i) => ({ id: c.servicos[i]?.id || uid(), nome: r.querySelector('[data-k=nome]').value.trim(), duracao: Number(r.querySelector('[data-k=duracao]').value) || 30, preco: num(r.querySelector('[data-k=preco]').value) }));
  c.horarios = {};
  v.querySelectorAll('.hrow').forEach(r => { const g = k => r.querySelector(`[data-k=${k}]`); c.horarios[r.dataset.d] = { ativo: g('ativo').checked, ini: g('ini').value || '09:00', fim: g('fim').value || '18:00', pIni: g('pIni').value || '', pFim: g('pFim').value || '' }; });
  c.intervalo = Number($('#aj-int').value) || 30;
  c.antecedenciaHoras = Math.max(0, Number($('#aj-ant').value) || 0);
  c.diasAFrente = Math.min(120, Math.max(1, Number($('#aj-dias').value) || 30));
}

/* ================= AÇÕES (cliques) ================= */
const ACTS = {
  fechar: () => closeSheet(),
  dia: d => { S.sel = d.d; renderAgenda(); },
  semana: d => { const x = parseYmd(S.sel); x.setDate(x.getDate() + Number(d.n)); S.sel = ymd(x); renderAgenda(); },
  novo: () => formAgendamento({}),
  confirmar: async d => {
    const a = byId(d.id); if (!a) return;
    await store.set('agendamentos', a.id, { status: 'confirmado', confirmadoEm: Date.now() });
    avisoSheet('Horário confirmado ✓', `${a.nome} · ${dataLonga(a.data)} às ${a.ini}`, a.telefone ? waLink(a.telefone, msgConfirmacao(a)) : null, 'Enviar confirmação no WhatsApp');
  },
  recusar: async d => {
    const a = byId(d.id); if (!a || !confirm(`Recusar o pedido de ${a.nome}?`)) return;
    await store.set('agendamentos', a.id, { status: 'recusado' }); await store.remove('ocupados', a.id);
    avisoSheet('Pedido recusado', 'O horário voltou a ficar livre. Avise a cliente e, se quiser, ofereça a lista de encaixe.', a.telefone ? waLink(a.telefone, msgRecusa(a)) : null, 'Avisar no WhatsApp');
  },
  cancelar: async d => {
    const a = byId(d.id); if (!a || !confirm(`Cancelar o horário de ${a.nome}?`)) return;
    await store.set('agendamentos', a.id, { status: 'cancelado' }); await store.remove('ocupados', a.id);
    const n = S.enc.filter(e => e.status === 'aguardando').length;
    avisoSheet('Horário liberado', n ? `Tem ${n} cliente(s) na lista de encaixe esperando uma vaga.` : 'O horário voltou a aparecer livre no link.', null, null, n ? { label: 'Ver lista de encaixe', act: 'irEncaixes' } : null);
  },
  excluirAg: async d => { if (!confirm('Apagar este horário cancelado?')) return; await store.remove('agendamentos', d.id); await store.remove('ocupados', d.id); },
  concluir: d => { const a = byId(d.id); a && formConcluir(a); },
  irEncaixes: () => { closeSheet(); go('encaixes'); },
  novoEnc: () => formEncaixe(),
  encaixar: d => { const e = S.enc.find(x => x.id === d.id); if (e) formAgendamento({ nome: e.nome, telefone: e.telefone, servicoId: e.servicoId, obs: e.obs, encaixeId: e.id, data: ymd(new Date()) }); },
  delEnc: async d => { if (confirm('Remover da lista de encaixe?')) await store.remove('encaixes', d.id); },
  mes: d => { const [y, m] = S.mes.split('-').map(Number); const x = new Date(y, m - 1 + Number(d.n), 1); S.mes = `${x.getFullYear()}-${pad(x.getMonth() + 1)}`; renderFin(); },
  novaVenda: () => formVenda(),
  novaDesp: () => formDesp(),
  delMov: async d => { if (confirm('Apagar esta movimentação?')) await store.remove(d.t === 'v' ? 'vendas' : 'despesas', d.id); },
  abrirChat: d => abrirChat(d.id),
  voltarChat: () => { fecharChat(); renderChatList(); },
  copiarLink: () => { const l = linkCliente(); (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => toast('Link copiado 💅')).catch(() => prompt('Copie o link:', l)); },
  addServ: () => { lerAjustes(); S.draft.servicos.push({ id: uid(), nome: '', duracao: 60, preco: 0 }); renderAjustes(); },
  delServ: d => { lerAjustes(); S.draft.servicos.splice(Number(d.i), 1); renderAjustes(); },
  addBloq: () => { const v = $('#novoBloq').value; if (!v) return; lerAjustes(); S.draft.bloqueios = [...new Set([...(S.draft.bloqueios || []), v])]; renderAjustes(); },
  delBloq: d => { lerAjustes(); S.draft.bloqueios = (S.draft.bloqueios || []).filter(b => b !== d.b); renderAjustes(); },
  salvarAjustes: async () => {
    lerAjustes(); const c = S.draft; c.servicos = c.servicos.filter(s => s.nome);
    if (!c.servicos.length) { toast('Cadastre pelo menos um serviço'); return; }
    await store.set('config', 'geral', c); toast('Ajustes salvos ✓'); renderAjustes();
  },
  notif: async () => {
    if (!('Notification' in window)) { toast('Este navegador não suporta avisos'); return; }
    const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Avisos ativados ✓' : 'Avisos não permitidos');
  },
  limparDemo: () => { if (!confirm('Apagar todos os dados de demonstração?')) return; try { Object.keys(localStorage).filter(k => k.startsWith('demo:')).forEach(k => localStorage.removeItem(k)); } catch (e) {} location.reload(); },
  sair: async () => { await fb.au.signOut(fb.auth); location.reload(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = ACTS[t.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(t.dataset, t);
});

/* ================= INÍCIO ================= */
function start(){
  store.watchDoc('config', 'geral', c => {
    if (!c){ store.set('config', 'geral', DEFAULT_CONFIG); return; }
    S.cfg = c; $('#nomeNegocio').textContent = c.nome || 'Minha agenda'; render();
  });
  store.watch('agendamentos', x => { S.ags = x; render(); });
  store.watch('encaixes', x => { S.enc = x; render(); });
  store.watch('vendas', x => { S.vendas = x; render(); });
  store.watch('despesas', x => { S.desp = x; render(); });
  store.watch('conversas', x => { S.convs = x; render(); });
  // limpa horários ocupados de dias que já passaram
  const hoje = ymd(new Date()); let un = null, done = false;
  un = store.watch('ocupados', os => { if (done) return; done = true; os.filter(o => o.data < hoje).forEach(o => store.remove('ocupados', o.id)); setTimeout(() => un && un(), 0); });
  setTimeout(() => { S.ready = true; }, 2500);
  render();
}

function seedDemo(){
